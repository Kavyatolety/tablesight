[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tablesight"
version = "0.1.0"
description = "Extract tables and figures from PDFs as clean, structured chunks for RAG pipelines."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kavya Tolety" }
]
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24"
]
keywords = ["pdf", "rag", "table-extraction", "document-ai", "chunking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tablesight = "tablesight.cli:main"

[project.urls]
Homepage = "https://github.com/Kavyatolety"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
